<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case 04 &mdash; Source Approaches Stationary Observer | Doppler Effect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Questrial:wght@400&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="styles/case.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>

<nav class="case-nav" id="caseNav">
  <div class="case-nav__left">
    <a href="../index.html#explore" class="case-nav__back"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg><span>Back</span></a>
    <span class="case-nav__badge" id="caseBadge">04</span>
  </div>
  <span class="case-nav__title" id="casePageTitle">Loading&hellip;</span>
  <div class="case-nav__arrows">
    <a id="prevBtn" class="case-nav__arrow" href="case-03.html"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg><span>Prev</span></a>
    <a id="nextBtn" class="case-nav__arrow" href="case-05.html"><span>Next</span><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4l6 6-6 6"/></svg></a>
  </div>
</nav>
<main class="case-layout">
  <aside class="case-panel" id="casePanel">
    <div id="caseContent">
      <div style="display:flex;align-items:center;justify-content:center;min-height:40vh;color:var(--text-mute);font-family:var(--font-mono);font-size:14px">Loading case content&hellip;</div>
    </div>
  </aside>

  <section class="sim-panel">
    <div class="sim-canvas-wrap">
      <div class="sim-viewport" id="simViewport">
        <div class="sim-stage" id="simStage">
          <canvas id="simCanvas"></canvas>
          <div class="sim-source-pos" id="simSourcePos"><img class="sim-source-img" id="simSourceImg" src="../assets/images/source.png" alt="Source"></div>
          <div class="sim-observer-pos" id="simObserverPos"><img class="sim-observer-img" id="simObserverImg" src="../assets/images/observer.png" alt="Observer"></div>
        </div>
        <button class="fs-btn" id="fsBtn" aria-label="Fullscreen"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5"/></svg></button>
      </div>
    </div>
    <div class="sim-footer" id="simFooter">
      <div class="sim-controls">
        <div class="controls-group">
          <button class="ctrl-btn ctrl-btn--play" id="playBtn"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><rect x="0" y="0" width="6" height="20" rx="1"/><rect x="11" y="0" width="6" height="20" rx="1"/></svg><span id="playLabel">Pause</span></button>
          <button class="ctrl-btn ctrl-btn--reset" id="resetBtn"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v5h5M16 16v-5h-5"/><path d="M4 9a8 8 0 0 1 13.66-4.66M16 11a8 8 0 0 1-13.66 4.66"/></svg><span>Reset</span></button>
        </div>
        <div class="speed-control">
          <button class="speed-btn" id="speedDec">−</button>
          <div class="speed-slider-wrap">
            <input type="range" id="speedRange" min="0" max="7" step="1" value="3">
            <span class="speed-marker"></span>
          </div>
          <button class="speed-btn" id="speedInc">+</button>
          <span class="speed-label" id="speedDisplay">1×</span>
        </div>
      </div>
      <div class="sim-footer__grid">
        <div class="sim-footer__item">
          <span class="sim-footer__label">Source Speed</span>
          <span class="sim-footer__value sim-footer__value--red" id="infoSrcSpeed">0</span>
          <span class="sim-footer__unit">m/s</span>
        </div>
        <div class="sim-footer__item">
          <span class="sim-footer__label">Observer Speed</span>
          <span class="sim-footer__value sim-footer__value--cyan" id="infoObsSpeed">0</span>
          <span class="sim-footer__unit">m/s</span>
        </div>
        <div class="sim-footer__item">
          <span class="sim-footer__label">Speed of Sound</span>
          <span class="sim-footer__value" id="infoSoundSpeed">340</span>
          <span class="sim-footer__unit">m/s</span>
        </div>
        <div class="sim-footer__item">
          <span class="sim-footer__label">Original Frequency</span>
          <span class="sim-footer__value" id="infoOrigFreq">500</span>
          <span class="sim-footer__unit">Hz</span>
        </div>
        <div class="sim-footer__item">
          <span class="sim-footer__label">Observed Frequency</span>
          <span class="sim-footer__value sim-footer__value--green" id="infoObsFreq">500</span>
          <span class="sim-footer__unit">Hz</span>
        </div>
        <div class="sim-footer__item">
          <span class="sim-footer__label">Frequency Shift</span>
          <span class="sim-footer__value sim-footer__value--purple" id="infoShift">+0</span>
          <span class="sim-footer__unit">Hz</span>
        </div>
        <div class="sim-footer__item" id="machCard" style="display:none">
          <span class="sim-footer__label">Mach Number</span>
          <span class="sim-footer__value sim-footer__value--gold" id="infoMach">0</span>
          <span class="sim-footer__unit">Ma</span>
        </div>
      </div>
    </div>
  </section>
</main>

<script>CASE_ID = 4;</script>
<script src="scripts/simulation.js"></script>
<script src="scripts/case.js"></script>
</body>
</html>
