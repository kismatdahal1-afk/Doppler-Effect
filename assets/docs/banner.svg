<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="titleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.6" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Asymmetric Doppler ring: tight radius (32) on the leading/front edge (right),
         wide radius (60) on the trailing/back edge (left) — compression vs. rarefaction,
         baked into the shape so it reads correctly at every scale, not just via timing -->
    <path id="dopplerRing"
      d="M 0,-32 A 32,32 0 0 1 0,32 A 60,60 0 0 1 0,-32 Z"
      fill="none" stroke="#38BDF8" stroke-width="2.4" filter="url(#glow)"/>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="420" fill="url(#bgGrad)"/>
  <ellipse cx="800" cy="205" rx="520" ry="230" fill="url(#titleGlow)"/>

  <!-- Doppler wavefronts: emitted along the ambulance's path -->
  <g stroke="#38BDF8">
    <use href="#dopplerRing" transform="translate(180,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.001;0.5;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.001;0.5;1" values="0;0.6;0;0"/>
    </use>
    <use href="#dopplerRing" transform="translate(387,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.167;0.667;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.167;0.667;1" values="0;0.6;0;0"/>
    </use>
    <use href="#dopplerRing" transform="translate(593,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.333;0.833;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.333;0.833;1" values="0;0.6;0;0"/>
    </use>
    <use href="#dopplerRing" transform="translate(800,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;0.999;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;0.999;1" values="0;0.6;0;0"/>
    </use>
    <use href="#dopplerRing" transform="translate(1007,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.667;0.999;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.667;0.999;1" values="0;0.6;0;0"/>
    </use>
    <use href="#dopplerRing" transform="translate(1213,120)" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.833;0.999;1" values="0;0;1.9;0"/>
      <animate attributeName="opacity" dur="5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.833;0.999;1" values="0;0.6;0;0"/>
    </use>
  </g>

  <!-- Ambulance (your PNG, same folder as this SVG: assets/docs/source.png) -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1" values="180 120;1420 120"/>
    <image href="source.png" xlink:href="source.png" x="-45" y="-20" width="90" height="40" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Title (static, no animation) -->
  <text x="800" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">🌊 Doppler Effect Interactive Learning Platform</text>
  <text x="800" y="240" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" opacity="0.85" letter-spacing="1">Visualizing Motion. Understanding Sound.</text>
</svg>